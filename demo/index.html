<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BUAA · 多模态情感AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Custom scrollbar for webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }
      @keyframes pulse-ring {
        0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
        70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
      }
      .recording-pulse {
        animation: pulse-ring 2s infinite;
      }
      
      /* CRITICAL FIX: Audio player styles */
      audio {
        width: 100% !important;
        height: auto !important;
        min-height: 32px !important;
        max-height: none !important;
        display: block !important;
        outline: none !important;
      }
      
      /* Fix for audio in prose content */
      .prose audio,
      .prose-sm audio,
      .prose-invert audio {
        margin: 0 !important;
        width: 100% !important;
        height: auto !important;
        max-height: none !important;
        display: block !important;
      }
      
      /* Ensure audio controls are visible */
      audio::-webkit-media-controls-panel {
        display: flex !important;
        background-color: rgba(255, 255, 255, 0.95) !important;
      }
      
      audio::-webkit-media-controls-play-button,
      audio::-webkit-media-controls-timeline,
      audio::-webkit-media-controls-current-time-display,
      audio::-webkit-media-controls-time-remaining-display,
      audio::-webkit-media-controls-mute-button,
      audio::-webkit-media-controls-volume-slider {
        display: block !important;
      }
    </style>
